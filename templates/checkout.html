{% load static %}
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - VASTRA</title>
<style>
.in{width:100%; padding:12px; margin:8px 0; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;}
.btn{background:black; color:white; padding:14px; width:100%; border:none; cursor:pointer; font-size:16px; font-weight:bold;}
.checkout-wrap{padding:40px 80px; display:flex; gap:40px}
@media(max-width:768px){.checkout-wrap{flex-direction:column; padding:20px}}
</style>
</head>
<body>

<nav class="navbar" style="padding:15px; display:flex; justify-content:space-between;"><div class="logo"><b>VASTRA</b> <span>The Fashion Store</span></div><div><a href="{% url 'cart' %}">Back to Cart</a></div></nav>

<section class="checkout-wrap">
<div style="flex:2; background:#fff; padding:30px; border:1px solid #eee; border-radius:8px;">
<h2 style="font-family:'Playfair Display'">Shipping Details</h2>

<form method="POST" id="checkoutForm">
{% csrf_token %}
<input class="in" type="text" name="name" placeholder="Full Name *" required>
<input class="in" type="text" name="phone" placeholder="Phone Number *" required>
<textarea class="in" name="address" placeholder="Full Address - House, Street, Area *" required style="height:100px"></textarea>
<input class="in" type="text" name="pincode" placeholder="Pincode *" required>

<h3 style="margin-top:25px">Payment Method</h3>
<select class="in" name="payment_method" id="pay_method" required>
<option value="COD">Cash on Delivery (COD)</option>
<option value="UPI">UPI / GPay / PhonePe</option>
<option value="CARD">Credit / Debit Card</option>
</select>

<div id="upi_box" style="display:none; background:#f9f9f9; padding:15px; border-radius:5px; margin-top:10px;">
<p><b>UPI ID:</b> vastra@upi</p>
<p style="font-size:13px">After payment, enter Transaction ID below</p>
<input class="in" type="text" name="transaction_id" id="txn_id" placeholder="Enter UPI Transaction ID / UTR">
</div>

<input type="hidden" name="cart_json" id="cart_json">
<button class="btn" type="submit" style="margin-top:15px;">PLACE ORDER - Pay ₹<span id="total_show">0</span></button>
</form>
</div>

<div style="flex:1; background:#fff; padding:25px; height:fit-content; border:1px solid #eee; border-radius:8px;">
<h3>Order Summary</h3>
<div id="order_items"></div>
<hr style="margin:15px 0;">
<div id="savings_box" style="color:green; font-size:14px;"></div>
<h3>Total: ₹<span id="total_side">0</span></h3>
<p style="font-size:13px; color:green">✓ Free Delivery ✓ Easy Returns</p>
</div>
</section>

<script>
function cleanPrice(p){ return parseFloat(String(p||0).replace(/[^0-9.]/g,'')) || 0; }

let cart = JSON.parse(localStorage.getItem('vastraCheckout') || localStorage.getItem('selectedCart') || localStorage.getItem('vastraCart') || '[]');
let total = 0, totalMrp = 0;
let itemsHtml = '';

if(cart.length > 0){
  cart.forEach(item => {
    let qty = parseInt(item.qty || item.quantity || 1);
    let price = cleanPrice(item.price);
    let orig = cleanPrice(item.original_price || item.price);
    let itemTotal = price * qty;
    let origTotal = orig * qty;
    total += itemTotal;
    totalMrp += origTotal;

    let discountLine = "";
    if(orig > price){
      discountLine = `<small style="text-decoration:line-through;color:gray;">₹${orig}</small> <small style="color:green;">${Math.round(((orig-price)/orig)*100)}% off</small>`;
    }

    itemsHtml += `<div style="padding:10px 0; border-bottom:1px dashed #eee;">
      <p style="margin:0;"><b>${item.name}</b> <span style="background:black; color:white; padding:2px 8px; border-radius:10px; font-size:11px;">Size: ${item.size || 'M'}</span> x ${qty}</p>
      <p style="margin:5px 0;">₹${price} x ${qty} = <b>₹${itemTotal}</b> ${discountLine}</p>
    </div>`;
  });
  document.getElementById('cart_json').value = JSON.stringify(cart);
} else {
  itemsHtml = '<p>Cart Empty - <a href="/shop/">Shop Now</a></p>';
}

document.getElementById('total_show').innerText = total;
document.getElementById('total_side').innerText = total;
document.getElementById('order_items').innerHTML = itemsHtml;

let savings = totalMrp - total;
if(savings > 0){
  document.getElementById('savings_box').innerHTML = `MRP: <s>₹${totalMrp}</s><br>You Save: <b>₹${savings}</b> 🎉`;
}

document.getElementById('pay_method').addEventListener('change', function(){
  if(this.value == 'UPI'){
    document.getElementById('upi_box').style.display = 'block';
    document.getElementById('txn_id').required = true;
  } else {
    document.getElementById('upi_box').style.display = 'none';
    document.getElementById('txn_id').required = false;
  }
});

document.getElementById('checkoutForm').addEventListener('submit', function(e){
  if(cart.length==0){ e.preventDefault(); alert("Cart empty!"); window.location.href="/shop/"; return false; }
  document.getElementById('cart_json').value = JSON.stringify(cart);
  console.log("Sending to Django:", cart);

  setTimeout(()=>{ 
    localStorage.removeItem('selectedCart'); 
    localStorage.removeItem('vastraCart');
    localStorage.removeItem('vastraCheckout');
    localStorage.removeItem('cart');
  }, 1000);
});

if(cart.length==0){
}
</script>

</body>
</html>
