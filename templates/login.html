<!DOCTYPE html>
<html>
<head>
<title>Login - VASTRA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0; font-family:Poppins, Arial; background:#fdf6f3; display:flex; justify-content:center; align-items:center; min-height:100vh;}
.login-box{background:white; padding:40px; border-radius:15px; box-shadow:0 10px 30px rgba(0,0,0,0.1); width:360px; text-align:center;}
.login-box h1{color:#2c3e50; letter-spacing:3px; margin-bottom:5px;}
.login-box .sub{color:#C9A86A; font-size:12px; letter-spacing:1px; margin-bottom:25px;}
.login-box input{width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px; outline:none; box-sizing:border-box;}
.login-box input:focus{border-color:#C9A86A;}
.login-box button{width:100%; padding:12px; background:#b08968; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold; margin-top:10px; font-size:16px;}
.login-box button:hover{background:#8c6a4f;}
.login-box p{margin-top:15px; font-size:14px;}
.login-box a{color:#b08968; text-decoration:none; font-weight:bold;}
.error{background:#ffe0e0; color:#c0392b; padding:10px; border-radius:6px; font-size:13px; border:1px solid #ffb3b3; margin-bottom:10px;}
</style>
</head>
<body>
<div class="login-box">
<h1>VASTRA</h1>
<p class="sub">THE FASHION STORE</p>

{% if error %}
<p class="error">⚠️ {{error}}</p>
{% endif %}

<form method="POST" action="{% url 'login' %}">
{% csrf_token %}
<input type="email" name="email" placeholder="Email Address *" required>
<input type="password" name="password" placeholder="Password *" required>
<button type="submit">Login</button>
</form>
<p>No account? <a href="{% url 'register' %}">Register Here</a></p>
<p><a href="{% url 'home' %}" style="color:gray; font-weight:normal;">← Back to Home</a></p>
</div>
</body>
</html>
