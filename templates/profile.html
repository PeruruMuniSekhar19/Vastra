<!DOCTYPE html>
<html>
<head>
  <title>My Profile - VASTRA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background: #f5f5f5;">
<div class="container mt-4" style="max-width: 650px;">
  <div class="card shadow p-4" style="border-radius: 15px; background: white;">
    <h4 class="mb-4">👤 My Profile</h4>
    
    {% if msg %}
      <div class="alert alert-success py-2">{{ msg }}</div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <label>Name:</label>
      <input type="text" name="name" value="{{ customer.name }}" class="form-control mb-3">
      
      <label>Email:</label>
      <input type="email" name="email" value="{{ customer.email }}" class="form-control mb-3">
      
      <label>Phone:</label>
      <input type="text" name="phone" value="{{ customer.phone }}" class="form-control mb-3">
      
      <label>Address:</label>
      <textarea name="address" class="form-control mb-3" rows="3">{{ customer.address }}</textarea>
      
      <button type="submit" name="update_profile" class="btn btn-dark w-100">💾 Update Profile</button>
    </form>

    <hr class="my-4">

    <h5>🔒 Change Password</h5>
    <form method="POST" class="mt-3">
      {% csrf_token %}
      <label>New Password</label>
      <input type="password" name="new_password" class="form-control mb-3" placeholder="Enter new password" required>
      
      <label>Confirm Password</label>
      <input type="password" name="confirm_password" class="form-control mb-3" placeholder="Confirm new password" required>
      
      <button type="submit" name="update_password" class="btn btn-warning w-100">Update Password</button>
    </form>

    <div class="text-center mt-4">
      <a href="/" class="text-decoration-none">← Home</a> | 
      <a href="/orders/" class="text-decoration-none">My Orders</a>
    </div>
  </div>
</div>
</body>
</html>
