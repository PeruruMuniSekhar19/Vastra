<!DOCTYPE html>
<html>
<head>
<title>Rate - VASTRA</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="background:#f5f5f5; font-family:Arial; margin:0;">

<div style="background:white; padding:15px; display:flex; justify-content:space-between; align-items:center;">
<b>VASTRA</b> <a href="/my-orders/" style="text-decoration:none; color:black;">← My Orders</a>
</div>

<div style="max-width:500px; margin:30px auto; background:white; padding:30px; border-radius:15px; box-shadow:0 5px 20px rgba(0,0,0,0.1);">
    <h2>⭐ Rate {{ product.name }}</h2>
    <img src="/static/images/{{ product.image }}" style="width:120px; height:120px; object-fit:cover; border-radius:10px; margin:15px 0;">
    <p>{{ product.name }} - ₹{{ product.price }}</p>
    
    <form method="POST" style="margin-top:20px;">
        {% csrf_token %}
        <label><b>Rating:</b></label>
        <select name="rating" style="width:100%; padding:12px; border-radius:8px; margin:10px 0; border:1px solid #ccc;">
            <option value="5">★★★★★ - Excellent</option>
            <option value="4">★★★★☆ - Good</option>
            <option value="3">★★★☆☆ - Average</option>
            <option value="2">★★☆☆☆ - Poor</option>
            <option value="1">★☆☆☆☆ - Bad</option>
        </select>
        
        <label><b>Review:</b></label>
        <textarea name="comment" rows="5" placeholder="Quality super! Fitting nice..." style="width:100%; padding:12px; border-radius:8px; border:1px solid #ccc; margin:10px 0;" required></textarea>
        
        <button type="submit" style="width:100%; background:black; color:white; padding:14px; border:none; border-radius:10px; font-weight:bold; margin-top:10px;">Submit Review</button>
    </form>
</div>

</body>
</html>
