<!DOCTYPE html>
<html>
<head>
<title>Register - VASTRA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Poppins, sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; background:#fdf6f3; margin:0;}
.box{background:white; padding:40px; border-radius:15px; width:360px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.1);}
.box h2{letter-spacing:3px; color:#2c3e50; margin-bottom:5px;}
.sub{color:#C9A86A; font-size:12px; letter-spacing:1px; margin-bottom:20px;}
input{width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px; box-sizing:border-box; outline:none;}
input:focus{border-color:#C9A86A;}
button{width:100%; padding:12px; background:#8e6d5a; color:white; border:none; border-radius:8px; cursor:pointer; margin-top:10px; font-weight:bold; font-size:16px;}
button:hover{background:#6d5242;}
a{text-decoration:none; color:#8e6d5a; font-size:14px; font-weight:bold;}
.error{background:#ffe0e0; color:#c0392b; padding:10px; border-radius:6px; font-size:13px; border:1px solid #ffb3b3;}
</style>
</head>
<body>
<div class="box">
<h2>VASTRA</h2>
<p class="sub">CREATE ACCOUNT</p>
{% if error %}<p class="error">⚠️ {{error}}</p>{% endif %}
<form method="POST" action="{% url 'register' %}">
{% csrf_token %}
<input type="text" name="name" placeholder="Full Name *" required>
<input type="email" name="email" placeholder="Email Address *" required>
<input type="password" name="password" placeholder="Password (min 6 chars) *" required minlength="6">
<button type="submit">Create Account</button>
</form>
<br>
<a href="{% url 'login' %}">Already have account? Login</a><br><br>
<a href="{% url 'home' %}" style="color:gray; font-weight:normal;">← Back to Home</a>
</div>
</body>
</html>
